<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Cave Fontana </title>
</head>
<body>

    <h1>Cadastro de Clientes - Cave Fontana</h1>

    <form style="background-color: #b661c2; border: 7px solid #3a0319;" action="#" method="POST">
        <label for="nome_cliente">Nome Completo:</label><br>
        <input type="text" id="nome_cliente" name="nome_cliente" placeholder="Digite seu nome completo" required><br><br>

        <label for="email_cliente">E-mail Pessoal:</label><br>
        <input type="email" id="email_cliente" name="email_cliente" placeholder="Digite seu e-mail principal" required><br><br>

        <label for="senha_cliente">Senha de Acesso:</label><br>
        <input type="password" id="senha_cliente" name="senha_cliente" placeholder="Crie uma senha segura"required><br><br>

        <label for="preferencia_vinhos">Estilo de Vinho Favorito:</label><br>
        <select id="preferencia_vinhos" name="preferencia_vinhos">
            <option value="tintos_encorpados">Tintos Encorpados e Clássicos</option>
            <option value="brancos_leves">Brancos Leves e Aromáticos</option>
            <option value="champagnes">Champagnes e Espumantes Finos</option>
            <option value="rosés">Rosés Delicados</option>
        </select><br><br>

        <input type="checkbox" id="termos_uso" name="termos_uso" required>
        <label for="termos_uso">Aceito os termos de uso da Cave Fontana</label><br><br>

        <button type="submit" name="btn_envio">Envio</button>
        <button type="reset" name="btn_limpar">Limpar</button>
      </form>

</body>
</html>
