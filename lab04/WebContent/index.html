<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cave Fontana</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="root">
    <div class="header">
      <div class="logo"><i class="ti ti-bottle"></i></div>
      <div>
        <div class="title">Cave Fontana</div>
        <div class="sub">Bando de dados CRUD</div>
      </div>
    </div>

    <div class="populate-bar">
      <div>
        <div class="populate-label">
          <strong>Popular banco de dados</strong>
          <span>Insere categorias, vinhos, clientes e pedidos de uma vez</span>
        </div>
        <div id="pop-status"></div>
      </div>
      <button id="btn-popular" onclick="popularDb()">
        <i class="ti ti-database-import"></i> Popular database
      </button>
    </div>

    <div class="sections">
      <div class="card">
        <div class="card-head"><i class="ti ti-tag"></i><span>Categorias de vinho</span></div>
        <div class="actions">
          <a class="btn primary" href="CategoriaVinhoServlet"><i class="ti ti-list"></i> Listar</a>
          <button class="btn inserir" onclick="inserir(this, 'CategoriaVinhoServlet?acao=inserir', 'cat')"><i class="ti ti-plus"></i> Inserir</button>
          <a class="btn" href="CategoriaVinhoServlet?acao=alterar"><i class="ti ti-edit"></i> Alterar</a>
          <a class="btn" href="CategoriaVinhoServlet?acao=remover"><i class="ti ti-trash"></i> Remover</a>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><i class="ti ti-bottle"></i><span>Vinhos</span></div>
        <div class="actions">
          <a class="btn primary" href="VinhoServlet"><i class="ti ti-list"></i> Listar</a>
          <button class="btn inserir" onclick="inserir(this, 'VinhoServlet?acao=inserir', 'vinho')"><i class="ti ti-plus"></i> Inserir</button>
          <a class="btn" href="VinhoServlet?acao=alterar"><i class="ti ti-edit"></i> Alterar</a>
          <a class="btn" href="VinhoServlet?acao=remover"><i class="ti ti-trash"></i> Remover</a>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><i class="ti ti-user"></i><span>Clientes</span></div>
        <div class="actions">
          <a class="btn primary" href="ClienteServlet"><i class="ti ti-list"></i> Listar</a>
          <button class="btn inserir" onclick="inserir(this, 'ClienteServlet?acao=inserir', 'cliente')"><i class="ti ti-plus"></i> Inserir</button>
          <a class="btn" href="ClienteServlet?acao=alterar"><i class="ti ti-edit"></i> Alterar</a>
          <a class="btn" href="ClienteServlet?acao=remover"><i class="ti ti-trash"></i> Remover</a>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><i class="ti ti-shopping-cart"></i><span>Pedidos e itens</span></div>
        <div class="actions">
          <a class="btn primary" href="PedidoServlet"><i class="ti ti-list"></i> Listar</a>
          <button class="btn inserir" onclick="inserir(this, 'PedidoServlet?acao=inserir', 'pedido')"><i class="ti ti-plus"></i> Inserir</button>
          <a class="btn" href="PedidoServlet?acao=alterar"><i class="ti ti-edit"></i> Alterar</a>
          <a class="btn" href="PedidoServlet?acao=remover"><i class="ti ti-trash"></i> Remover</a>
        </div>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
